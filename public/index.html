<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AchSwap — Send Mail</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; background:#0f172a; color:#e2e8f0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .wrap { width:100%; max-width:520px; }
  .card { background:#1e293b; border:1px solid #334155; border-radius:20px; padding:28px; box-shadow:0 20px 60px rgba(0,0,0,.4); }
  .logo { font-size:24px; font-weight:800; letter-spacing:-.5px; color:#fff; text-align:center; }
  .logo span { color:#818cf8; }
  .sub { text-align:center; color:#94a3b8; font-size:13px; margin:6px 0 22px; }
  label { display:block; font-size:13px; font-weight:600; color:#cbd5e1; margin:14px 0 6px; }
  input, textarea, select { width:100%; background:#0f172a; border:1px solid #334155; border-radius:12px; color:#f1f5f9; padding:12px 14px; font-size:15px; outline:none; transition:.15s; }
  input:focus, textarea:focus, select:focus { border-color:#6366f1; box-shadow:0 0 0 3px rgba(99,102,241,.25); }
  select { appearance:none; cursor:pointer; }
  select option { background:#0f172a; }
  textarea { min-height:140px; resize:vertical; line-height:1.5; }
  button { width:100%; margin-top:18px; background:linear-gradient(90deg,#6366f1,#8b5cf6); border:none; color:#fff; font-size:16px; font-weight:700; padding:14px; border-radius:12px; cursor:pointer; transition:.15s; }
  button:hover { opacity:.9; } button:disabled { opacity:.5; cursor:not-allowed; }
  .status { margin-top:14px; font-size:14px; text-align:center; min-height:20px; }
  .ok { color:#4ade80; } .err { color:#f87171; }
  .from { text-align:center; font-size:12px; color:#64748b; margin-top:12px; }
  @media (max-width:480px){ .card{padding:20px;} body{padding:12px;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="logo">Ach<span>Swap</span></div>
    <div class="sub">Send email via Resend</div>
    <form id="f">
      <label for="from">From</label>
      <select id="from" required>
        <option value="support@achswap.app" selected>support@achswap.app</option>
        <option value="admin@achswap.app">admin@achswap.app</option>
        <option value="sukanto@achswap.app">sukanto@achswap.app</option>
        <option value="hossain@achswap.app">hossain@achswap.app</option>
        <option value="asif@achswap.app">asif@achswap.app</option>
      </select>
      <label for="to">To mail</label>
      <input id="to" type="email" placeholder="customer@example.com" required>
      <label for="subject">Subject</label>
      <input id="subject" type="text" placeholder="Welcome to AchSwap!" required>
      <label for="message">Message</label>
      <textarea id="message" placeholder="Write your message here...&#10;&#10;Line breaks are kept." required></textarea>
      <button id="btn" type="submit">Send email</button>
      <div id="status" class="status"></div>
    </form>
    <div class="from">From: <span id="fromEcho">support@achswap.app</span></div>
  </div>
</div>
<script>
const f = document.getElementById('f');
const btn = document.getElementById('btn');
const status = document.getElementById('status');
const fromSel = document.getElementById('from');
const fromEcho = document.getElementById('fromEcho');
fromSel.addEventListener('change', () => { fromEcho.textContent = fromSel.value; });
f.addEventListener('submit', async (e) => {
  e.preventDefault();
  status.textContent = 'Sending...'; status.className = 'status';
  btn.disabled = true;
  try {
    const res = await fetch('/api/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        from: fromSel.value,
        to: document.getElementById('to').value.trim(),
        subject: document.getElementById('subject').value.trim(),
        message: document.getElementById('message').value
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed');
    status.textContent = '✅ Email sent! ID: ' + (data.id || 'ok');
    status.className = 'status ok';
    f.reset();
    fromEcho.textContent = fromSel.value;
  } catch (err) {
    status.textContent = '❌ ' + err.message;
    status.className = 'status err';
  } finally { btn.disabled = false; }
});
</script>
</body>
</html>
